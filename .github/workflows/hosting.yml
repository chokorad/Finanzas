name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciales
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Crear sitio (si no existe) y publicar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@13 hosting:sites:create finanzas-mhq --project cobros-97f8b || echo "sitio ya existe o sin permiso de crear"
          npx --yes firebase-tools@13 deploy --only hosting --project cobros-97f8b --non-interactive
